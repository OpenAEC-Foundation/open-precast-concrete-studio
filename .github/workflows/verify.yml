name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Geometry, drawings and IFC4
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: python -m pip install ifcopenshell==0.9.0.post1 pytest
      - run: python tests/verify-ifc.py
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Precast-Concrete-Studio
          path: dist/*.zip
          if-no-files-found: error
