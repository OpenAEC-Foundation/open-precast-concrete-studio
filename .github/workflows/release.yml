name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Open-Precast-Concrete-Studio
          path: dist
      - name: Check tag and publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          archive="dist/Open-Precast-Concrete-Studio-$version.zip"
          test -f "$archive"
          (cd dist && sha256sum "Open-Precast-Concrete-Studio-$version.zip" > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "$archive" dist/SHA256SUMS.txt --verify-tag --title "Open Precast Concrete Studio $GITHUB_REF_NAME" --notes-file .github/release-notes.md
