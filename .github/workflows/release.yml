name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  windows:
    name: Build, install and draw a balcony on Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Match the release tag to the desktop, Rust and npm versions
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Expected the release tag v$version."
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $manifest = (Resolve-Path -LiteralPath 'src-tauri/Cargo.toml').Path
          $crate = @(($metadata | ConvertFrom-Json).packages | Where-Object { $_.manifest_path -eq $manifest })
          $desktop = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($crate.Count -ne 1 -or $crate[0].version -cne $version -or $desktop.version -cne $version) {
            throw "The Rust crate and Tauri app must both have version $version."
          }
          "number=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: cargo fetch --locked
      - name: Build the NSIS installer
        run: npm run desktop:build
      - name: Install desktop test dependencies
        run: python -m pip install playwright==1.65.2 pywin32==312 ifcopenshell==0.9.0.post1 pypdf==7.2.0
      - name: Prepare standard-user launch for the installed app
        shell: pwsh
        run: |
          # WebView2 ignores the test-only debugging port on elevated hosts.
          $archive = Join-Path $env:RUNNER_TEMP 'gsudo.portable.zip'
          Invoke-WebRequest 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44') {
            throw 'Unexpected gsudo package checksum.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'gsudo')
      - name: Fetch the three published installers for the upgrade tests
        shell: pwsh
        run: |
          $checksums = @{
            '0.4.1' = '30dbaf2449f9f0bb3e269df283dad090485448d8a27e0fc1c51ab781c0122695'
            '0.5.0' = '2fc9983d93ca3a2abcca7bbcc5e5671cbb60c75cbff8f39cb5162b8e05246f5f'
            '0.5.1' = 'd6e32ece747f273108ec343843b4addb04b7e6434556bb48be3dd639685b9789'
          }
          foreach ($version in $checksums.Keys) {
            $previous = Join-Path $env:RUNNER_TEMP "open-precast-$version-setup.exe"
            Invoke-WebRequest "https://github.com/OpenAEC-Foundation/open-precast-concrete-studio/releases/download/v$version/Open-Precast-Concrete-Studio-$version-windows-x64-setup.exe" -OutFile $previous
            if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne $checksums[$version]) {
              throw "Unexpected checksum for the $version Windows installer."
            }
          }
      - name: Upgrade saved balconies and recover unsaved edits after running each older version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $built = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($built.Count -ne 1) { throw "Expected one NSIS installer. Found $($built.Count)." }
          New-Item -Type Directory -Force 'dist' | Out-Null
          $installer = Join-Path $PWD "dist/Open-Precast-Concrete-Studio-$env:APP_VERSION-windows-x64-setup.exe"
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          $python = (Get-Item -LiteralPath (Join-Path $env:pythonLocation 'python.exe')).FullName
          $test = (Resolve-Path -LiteralPath 'tests/verify-installed.py').Path
          $output = New-Item -Type Directory -Path (Join-Path $env:RUNNER_TEMP 'installed-test')
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $output.FullName /grant:r "*${userSid}:(OI)(CI)M"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot grant the test account access to its output directory.' }
          $gsudo = (Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'gsudo/x64/gsudo.exe')).FullName
          foreach ($version in @('0.4.1','0.5.0','0.5.1')) {
            $previous = Join-Path $env:RUNNER_TEMP "open-precast-$version-setup.exe"
            $evidence = Join-Path $output.FullName "from-$version"
            & $gsudo --direct --wait --integrity Medium $python $test $installer --upgrade-from $previous --output $evidence
            if ($LASTEXITCODE -ne 0) { throw "Upgrade test from $version exited with code $LASTEXITCODE." }
          }
      - name: Preserve the IFC and screenshot from the installed app
        uses: actions/upload-artifact@v7
        with:
          name: Windows-installed-app-test
          path: ${{ runner.temp }}/installed-test
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-x64-installer
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the verified installer and offline editor
    needs: [verify, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Windows-x64-installer
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: Open-Precast-Concrete-Studio
          path: dist
      - name: Check release files and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="Open-Precast-Concrete-Studio-$version-windows-x64-setup.exe"
          archive="Open-Precast-Concrete-Studio-$version.zip"
          (cd dist && sha256sum "$installer" "$archive" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git fetch --quiet --depth=1 --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          gh release create "$GITHUB_REF_NAME" "dist/$installer" "dist/$archive" dist/SHA256SUMS.txt \
            --verify-tag --title "Open Precast Concrete Studio $GITHUB_REF_NAME" --notes-file .github/release-notes.md
